<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1c20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Belt Scale · Span Coefficient Calculator</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    background: #1a1c20;
    background-image: radial-gradient(ellipse at 50% -10%, rgba(200,190,170,.04), transparent 55%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #c9cdd3;
  }
  .card {
    background: #202329;
    border: 1px solid #2b2f36;
    border-radius: 16px;
    padding: 28px 22px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 30px 70px rgba(0,0,0,.45);
    position: relative;
  }

  .info-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid #4a5058;
    color: #8b93a1;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .2s;
    font-family: Georgia, serif;
  }
  .info-btn:hover {
    border-color: #b8a888;
    color: #b8a888;
    background: rgba(184,168,136,.08);
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 11, 14, 0.75);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: #202329;
    border: 1px solid #2b2f36;
    border-radius: 14px;
    padding: 22px 20px;
    max-width: 360px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    transform: translateY(10px);
    transition: transform .25s ease;
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  .modal-title {
    font-size: 13px; font-weight: 600; color: #eceef1;
    letter-spacing: .5px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .modal-title::before {
    content: "i"; display: inline-flex;
    width: 18px; height: 18px; border-radius: 50%;
    background: #b8a888; color: #1a1c20;
    font-size: 11px; font-weight: 800;
    align-items: center; justify-content: center;
    font-family: Georgia, serif;
  }
  .modal-list {
    list-style: none;
    font-size: 11.5px; color: #8b93a1; line-height: 1.6;
  }
  .modal-list li {
    padding: 8px 0;
    border-bottom: 1px dashed #2b2f36;
  }
  .modal-list li:last-child { border-bottom: none; }
  .modal-list b { color: #c9cdd3; font-weight: 600; }

  .modal-btn {
    margin-top: 18px; width: 100%; padding: 11px;
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: #1a1c20;
    background: #c9cdd3; border: none; border-radius: 7px;
    cursor: pointer; transition: background .2s;
  }
  .modal-btn:hover { background: #eceef1; }

  h1 {
    font-size: 15px; font-weight: 600; text-align: center;
    color: #eceef1; letter-spacing: .3px; margin-bottom: 4px;
  }
  .sub {
    text-align: center; font-size: 10px; color: #767d88;
    letter-spacing: 1.8px; text-transform: uppercase; margin-bottom: 20px;
  }

  .top-meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .test-block {
    background: #17191d;
    border: 1px solid #2b2f36;
    border-radius: 11px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .test-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 11px;
    gap: 8px;
  }
  .test-title {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #b8a888;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .mini-actions {
    display: flex;
    gap: 5px;
    flex-wrap: nowrap;
    align-items: center;
  }
  .mini-btn {
    font-size: 10px;
    padding: 4px 7px;
    border-radius: 5px;
    border: 1px solid #3a3f47;
    background: #202329;
    color: #9aa2b0;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
  }
  .mini-btn:hover { border-color: #b8a888; color: #eceef1; }
  .mini-btn.del { padding: 4px 8px; }
  .mini-btn.del:hover { border-color: #c99494; color: #c99494; }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .grid-2 .full { grid-column: 1 / -1; }

  label {
    display: block;
    font-size: 9.5px;
    font-weight: 500;
    color: #8b93a1;
    letter-spacing: .5px;
    padding-left: .5px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  input {
    width: 100%;
    padding: 11px 10px;
    font-size: 15px;
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    color: #eceef1;
    font-weight: 500;
    text-align: center;
    background: #202329;
    border: 1px solid #2b2f36;
    border-radius: 8px;
    outline: none;
    transition: border .2s, box-shadow .2s;
  }
  input.top-input {
    background: #17191d;
  }
  input.tag-text {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    letter-spacing: .3px;
  }
  input:focus {
    border-color: #b8a888;
    box-shadow: 0 0 0 3px rgba(184,168,136,.08);
  }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .live-diff {
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px dashed #262a30;
    display: none;
    justify-content: space-between;
    align-items: center;
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 11px;
    color: #8b93a1;
  }
  .live-diff.show { display: flex; }

  .add-test-btn {
    width: 100%;
    padding: 10px;
    margin-bottom: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #9aa2b0;
    background: transparent;
    border: 1px dashed #3a3f47;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
  }
  .add-test-btn:hover {
    border-color: #b8a888;
    color: #b8a888;
    background: rgba(184,168,136,.04);
  }

  .action-group {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  button.calc-btn {
    flex: 2;
    padding: 14px;
    font-size: 12px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: #1a1c20;
    background: #c9cdd3; border: none; border-radius: 9px; cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button.calc-btn:hover { background: #eceef1; }
  button.calc-btn:active { transform: scale(.99); }

  button.reset-btn {
    flex: 1;
    padding: 14px;
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: #8b93a1;
    background: transparent;
    border: 1px solid #4a5058;
    border-radius: 9px; cursor: pointer;
    transition: all .2s;
  }
  button.reset-btn:hover {
    color: #eceef1;
    border-color: #8b93a1;
    background: rgba(255,255,255,.03);
  }

  .result { margin-top: 22px; display: none; }
  .result.show { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .test-res-item {
    background: #17191d;
    border: 1px solid #262a30;
    border-radius: 10px;
    padding: 11px 12px;
    margin-bottom: 9px;
  }
  .test-res-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    color: #eceef1;
    margin-bottom: 8px;
  }
  .test-res-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding-bottom: 8px;
    border-bottom: 1px dashed #262a30;
    text-align: center;
  }
  .test-res-cell .k {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: #767d88;
    margin-bottom: 2px;
  }
  .test-res-cell .v {
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 11.5px;
    color: #c9cdd3;
    font-weight: 500;
  }
  .test-res-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 11px;
    color: #8b93a1;
    gap: 8px;
  }
  .test-res-foot b { color: #eceef1; }

  .c-ok   { color: #b2c7ac; }
  .c-warn { color: #d4bb8a; }
  .c-err  { color: #c99494; }

  .row {
    display: flex; justify-content: space-between;
    font-size: 12px; padding: 6px 0; color: #8b93a1;
  }
  .row span:last-child {
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-weight: 500; color: #c9cdd3;
  }
  .divider { height: 1px; background: #262a30; margin: 14px 0; }

  .mode-switch {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .mode-btn {
    flex: 1;
    padding: 7px 10px;
    font-size: 10.5px;
    font-weight: 600;
    border-radius: 7px;
    border: 1px solid #3a3f47;
    background: #17191d;
    color: #8b93a1;
    cursor: pointer;
    transition: all .2s;
    font-family: "SF Mono", Consolas, monospace;
  }
  .mode-btn.active {
    border-color: #b8a888;
    background: rgba(184,168,136,.12);
    color: #eceef1;
  }

  .big { text-align: center; padding: 6px 0 14px; }
  .big .label {
    font-size: 10px; color: #767d88; letter-spacing: 1.8px;
    text-transform: uppercase; margin-bottom: 10px; font-weight: 500;
  }
  .big .label.ref { color: #9bb094; }
  .big .value {
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 40px; font-weight: 300; color: #eceef1;
    line-height: 1; letter-spacing: -.5px; word-break: break-all;
  }
  .big .value.small { font-size: 30px; }
  .big .value.ref { color: #b2c7ac; }

  .result-actions {
    display: flex;
    justify-content: center;
    margin-top: 14px;
  }
  .jpg-btn {
    padding: 8px 18px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .9px;
    text-transform: uppercase;
    color: #b8a888;
    background: #17191d;
    border: 1px solid rgba(184,168,136,.5);
    border-radius: 6px;
    cursor: pointer;
    transition: all .2s;
  }
  .jpg-btn:hover {
    background: rgba(184,168,136,.12);
    border-color: #b8a888;
    color: #eceef1;
  }

  .badge {
    display: inline-block;
    font-size: 10.5px;
    padding: 4px 10px;
    border-radius: 99px;
    font-weight: 600;
    letter-spacing: .3px;
    margin-top: 14px;
  }
  .badge.ok   { background: rgba(155,176,148,.14); color: #b2c7ac; }
  .badge.warn { background: rgba(212,187,138,.14); color: #d4bb8a; }
  .badge.err  { background: rgba(201,148,148,.14); color: #c99494; }

  .akurasi-box { padding: 8px 0 0; }
  .akurasi-head {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 8px;
  }
  .akurasi-head .t {
    font-size: 10px; color: #8b93a1; letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500;
  }
  .akurasi-head .v {
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 18px; font-weight: 500; color: #eceef1;
  }
  .akurasi-head .v.ok   { color: #b2c7ac; }
  .akurasi-head .v.warn { color: #d4bb8a; }
  .akurasi-head .v.err  { color: #c99494; }

  .bar { height: 4px; border-radius: 2px; background: #262a30; overflow: hidden; }
  .bar > div {
    height: 100%; border-radius: 2px;
    transition: width .7s cubic-bezier(.4,0,.2,1);
  }
  .bar > div.ok   { background: #9bb094; }
  .bar > div.warn { background: #d4bb8a; }
  .bar > div.err  { background: #c99494; }

  .note {
    font-size: 10.5px; color: #767d88; text-align: center;
    margin-top: 22px; line-height: 1.6; letter-spacing: .2px;
  }

  /* ===== Pop-up instal ===== */
  .install-overlay {
    z-index: 110;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s;
  }
  .install-overlay.show { visibility: visible; }
  .install-box { max-width: 320px; text-align: center; max-height: 100%; overflow-y: auto; }
  .install-icon {
    display: block; width: 76px; height: 76px; padding: 14px;
    margin: 0 auto 14px; border-radius: 50%;
    color: #b8a888; background: rgba(184,168,136,.12);
  }
  .install-title { font-size: 16px; font-weight: 600; color: #eceef1; margin-bottom: 6px; }
  .install-desc { font-size: 12px; color: #8b93a1; line-height: 1.6; }
  .modal-btn.alt {
    margin-top: 8px; color: #8b93a1;
    background: transparent; border: 1px solid #4a5058;
  }
  .modal-btn.alt:hover { color: #eceef1; background: rgba(255,255,255,.03); }
</style>
</head>
<body>

<div class="card">
  <button type="button" class="info-btn" onclick="toggleModal()" aria-label="Best Practice Lapangan" title="Best Practice Lapangan">i</button>

  <h1>Coefficient Calculator</h1>
  <p class="sub">Belt Scale · Span Correction</p>

  <form onsubmit="event.preventDefault(); hitung();">
    <!-- TAG ID & TOLERANCE -->
    <div class="top-meta-grid">
      <div>
        <label for="tagId">Tag ID (Optional)</label>
        <input type="text" id="tagId" class="top-input tag-text" maxlength="32" oninput="onInputChange()">
      </div>
      <div>
        <label for="tolInput">Tolerance (±%)</label>
        <input type="number" id="tolInput" class="top-input" value="0.5" step="any" inputmode="decimal" oninput="onInputChange()">
      </div>
    </div>

    <!-- DYNAMIC TESTS CONTAINER -->
    <div id="testsContainer">
      <div class="test-block">
        <div class="test-head">
          <span class="test-title">Test 1</span>
          <div class="mini-actions">
            <button type="button" class="mini-btn" onclick="isiDefaultK1()">Init = 1</button>
          </div>
        </div>
        <div class="grid-2">
          <div class="full">
            <label class="lbl-k" for="k1">Old Coef (K1)</label>
            <input type="number" id="k1" class="inp-k" step="any" inputmode="decimal" oninput="onInputChange()">
          </div>
          <div>
            <label class="lbl-a" for="a1">Actual (kg)</label>
            <input type="number" id="a1" class="inp-a" step="any" inputmode="decimal" oninput="onInputChange()">
          </div>
          <div>
            <label class="lbl-d" for="d1">Display (kg)</label>
            <input type="number" id="d1" class="inp-d" step="any" inputmode="decimal" oninput="onInputChange()">
          </div>
        </div>
        <div class="live-diff"></div>
      </div>
    </div>

    <button type="button" class="add-test-btn" id="addTestBtn" onclick="tambahTes()">+ Add Test 2</button>

    <div class="action-group">
      <button type="submit" class="calc-btn">Calculate</button>
      <button type="button" class="reset-btn" onclick="resetForm()">Reset</button>
    </div>
  </form>

  <div class="result" id="result"></div>

  <p class="note">
    New Coef = Old Coef × (Actual ÷ Display) · Init = 1.000<br>
    Diff = Display − Actual (kg)
  </p>
</div>

<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle">Best Practice Lapangan</div>
    <ul class="modal-list" id="modalList"></ul>
    <button type="button" class="modal-btn" onclick="toggleModal()">Mengerti</button>
  </div>
</div>

<!-- POP-UP INSTAL APLIKASI -->
<div class="modal-overlay install-overlay" id="installModal" role="dialog" aria-modal="true" aria-labelledby="installTitle">
  <div class="modal-box install-box">
    <svg class="install-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="5" y="2" width="14" height="20" rx="3"/>
      <path d="M10.5 4.8h3"/>
      <path d="M12 8v7.5"/>
      <path d="M8.8 12.5l3.2 3.2 3.2-3.2"/>
      <path d="M9.5 18.8h5"/>
    </svg>
    <h2 class="install-title" id="installTitle">Instal Aplikasi</h2>
    <p class="install-desc" id="installDesc">Buka langsung dari layar HP dan bisa dipakai offline.</p>
    <button type="button" class="modal-btn" id="installPrimary">Instal</button>
    <button type="button" class="modal-btn alt" id="installLater">Nanti Saja</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'kalkulatorCoefMatData';
let lastReportData = null;

function getTestBlocks() {
  return Array.from(document.querySelectorAll('#testsContainer .test-block'));
}

function getTol() {
  const raw = document.getElementById('tolInput').value.trim();
  if (!raw) return 0.5;
  const val = parseFloat(raw);
  if (isNaN(val) || val <= 0 || val >= 50) return null;
  return val;
}

function getWarnMax(tol) {
  return Number(Math.min(tol * 3, tol + 1).toFixed(2));
}

function fmtPctClean(n) {
  const r = Number(n.toFixed(2));
  const isInt = Math.abs(r - Math.round(r)) < 1e-6;
  return r.toLocaleString('id-ID', {
    minimumFractionDigits: isInt ? 0 : 1,
    maximumFractionDigits: 2
  });
}

function updateModalInfo() {
  const tol = getTol() || 0.5;
  const warnMax = getWarnMax(tol);
  const tStr = fmtPctClean(tol);
  const wStr = fmtPctClean(warnMax);

  document.getElementById('modalList').innerHTML = `
    <li><b>Error &lt; ${tStr}%</b><br>Jangan diubah. Akurasi masuk target toleransi (±${tStr}%), biarkan sistem stabil.</li>
    <li><b>Error ${tStr}% – ${wStr}%</b><br>Update ke New Coef, lalu <b>wajib verifikasi</b> dengan pengetesan berikutnya.</li>
    <li><b>Error &gt; ${wStr}%</b><br><b>Langsung ubah</b> koefisien di indikator, lalu lakukan pengetesan ulang.</li>
  `;
}

function toggleModal() {
  updateModalInfo();
  document.getElementById('modal').classList.toggle('show');
}
function closeModal(e) {
  if (e.target.id === 'modal') {
    document.getElementById('modal').classList.remove('show');
  }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('modal').classList.remove('show');
  }
});

function formatCoef3(val) {
  if (!isFinite(val)) return '0.000';
  return Math.abs(val) < 0.1 ? val.toFixed(4) : val.toFixed(3);
}

function fmtId(n, minDec = 0, maxDec = 2) {
  return n.toLocaleString('id-ID', {
    minimumFractionDigits: minDec,
    maximumFractionDigits: maxDec
  });
}

function fmtKg(n) {
  const rounded = Number(n.toFixed(2));
  const isInt = Math.abs(rounded - Math.round(rounded)) < 1e-6;
  return fmtId(rounded, isInt ? 0 : 1, 2);
}

function getStatus(errPct, tol) {
  const warnMax = getWarnMax(tol);
  const tStr = fmtPctClean(tol);
  const wStr = fmtPctClean(warnMax);

  if (errPct < tol)      return { kls: 'ok',   teks: `Error < ${tStr}% · Pertahankan Old Coef` };
  if (errPct <= warnMax) return { kls: 'warn', teks: `Error ${tStr}–${wStr}% · Ubah & Verifikasi Ulang` };
  return { kls: 'err', teks: `Error > ${wStr}% · Wajib Ubah Coef` };
}

function onInputChange() {
  simpanData();
  updateLivePreview();
}

function updateLivePreview() {
  const tol = getTol() || 0.5;
  getTestBlocks().forEach(block => {
    const box = block.querySelector('.live-diff');
    const a = parseFloat(block.querySelector('.inp-a').value);
    const d = parseFloat(block.querySelector('.inp-d').value);
    if (a > 0 && d > 0) {
      const selisih = d - a;
      const errPct = Math.abs(selisih) / a * 100;
      const st = getStatus(errPct, tol);
      const tanda = selisih > 0 ? '+' : '';
      const ket = selisih > 0 ? 'Lebih' : (selisih < 0 ? 'Kurang' : 'Pas');
      box.className = 'live-diff show';
      box.innerHTML = `
        <span>Diff: <b class="c-${st.kls}">${tanda}${fmtKg(selisih)} kg</b> (${ket})</span>
        <span class="c-${st.kls}">Err ${fmtId(errPct, 2, 2)}%</span>
      `;
    } else {
      box.className = 'live-diff';
      box.innerHTML = '';
    }
  });
}

function updateAddBtn() {
  const nextNo = getTestBlocks().length + 1;
  document.getElementById('addTestBtn').textContent = `+ Add Test ${nextNo}`;
}

function createTestBlock(no, values = { k: '', a: '', d: '' }) {
  const div = document.createElement('div');
  div.className = 'test-block';
  div.innerHTML = `
    <div class="test-head">
      <span class="test-title">Test ${no}</span>
      <div class="mini-actions">
        <button type="button" class="mini-btn" onclick="salinK(this, 'awal')">= K1</button>
        <button type="button" class="mini-btn btn-prev" onclick="salinK(this, 'hasil')">New ${no - 1}</button>
        <button type="button" class="mini-btn del" onclick="hapusTes(this)" title="Delete Test ${no}">✕</button>
      </div>
    </div>
    <div class="grid-2">
      <div class="full">
        <label class="lbl-k" for="k${no}">Old Coef (K${no})</label>
        <input type="number" id="k${no}" class="inp-k" step="any" inputmode="decimal" oninput="onInputChange()">
      </div>
      <div>
        <label class="lbl-a" for="a${no}">Actual (kg)</label>
        <input type="number" id="a${no}" class="inp-a" step="any" inputmode="decimal" oninput="onInputChange()">
      </div>
      <div>
        <label class="lbl-d" for="d${no}">Display (kg)</label>
        <input type="number" id="d${no}" class="inp-d" step="any" inputmode="decimal" oninput="onInputChange()">
      </div>
    </div>
    <div class="live-diff"></div>
  `;
  div.querySelector('.inp-k').value = values.k || '';
  div.querySelector('.inp-a').value = values.a || '';
  div.querySelector('.inp-d').value = values.d || '';
  return div;
}

function reindexTests() {
  getTestBlocks().forEach((block, idx) => {
    const no = idx + 1;
    block.querySelector('.test-title').textContent = `Test ${no}`;

    const lblK = block.querySelector('.lbl-k');
    const inpK = block.querySelector('.inp-k');
    lblK.textContent = `Old Coef (K${no})`;
    lblK.setAttribute('for', `k${no}`);
    inpK.id = `k${no}`;

    const lblA = block.querySelector('.lbl-a');
    const inpA = block.querySelector('.inp-a');
    lblA.setAttribute('for', `a${no}`);
    inpA.id = `a${no}`;

    const lblD = block.querySelector('.lbl-d');
    const inpD = block.querySelector('.inp-d');
    lblD.setAttribute('for', `d${no}`);
    inpD.id = `d${no}`;

    const btnPrev = block.querySelector('.btn-prev');
    if (btnPrev) btnPrev.textContent = `New ${no - 1}`;

    const btnDel = block.querySelector('.del');
    if (btnDel) btnDel.title = `Delete Test ${no}`;
  });
  updateAddBtn();
}

function getAutoNextK(blocks) {
  const tol = getTol() || 0.5;
  for (let i = blocks.length - 1; i >= 0; i--) {
    const kPrev = parseFloat(blocks[i].querySelector('.inp-k').value);
    const aPrev = parseFloat(blocks[i].querySelector('.inp-a').value);
    const dPrev = parseFloat(blocks[i].querySelector('.inp-d').value);
    if (kPrev > 0 && aPrev > 0 && dPrev > 0) {
      const errPrev = Math.abs(aPrev - dPrev) / aPrev * 100;
      return formatCoef3(errPrev < tol ? kPrev : kPrev * (aPrev / dPrev));
    }
  }
  return blocks[0].querySelector('.inp-k').value || '';
}

function tambahTes(prefill = null, skipSave = false) {
  const container = document.getElementById('testsContainer');
  const blocks = getTestBlocks();
  const nextNo = blocks.length + 1;
  const initValues = prefill || { k: getAutoNextK(blocks), a: '', d: '' };
  container.appendChild(createTestBlock(nextNo, initValues));
  updateAddBtn();
  if (!skipSave) onInputChange();
}

function hapusTes(btn) {
  const blocks = getTestBlocks();
  if (blocks.length <= 1) return;
  const block = btn.closest('.test-block');
  block.remove();
  reindexTests();
  onInputChange();
}

function isiDefaultK1() {
  const first = getTestBlocks()[0];
  if (first) first.querySelector('.inp-k').value = '1.000';
  onInputChange();
}

function salinK(btn, mode) {
  const block = btn.closest('.test-block');
  const blocks = getTestBlocks();
  const idx = blocks.indexOf(block);

  if (mode === 'awal') {
    const k1 = blocks[0].querySelector('.inp-k').value;
    if (k1) block.querySelector('.inp-k').value = k1;
  } else if (mode === 'hasil') {
    for (let i = idx - 1; i >= 0; i--) {
      const kPrev = parseFloat(blocks[i].querySelector('.inp-k').value);
      const aPrev = parseFloat(blocks[i].querySelector('.inp-a').value);
      const dPrev = parseFloat(blocks[i].querySelector('.inp-d').value);
      if (kPrev > 0 && aPrev > 0 && dPrev > 0) {
        block.querySelector('.inp-k').value = formatCoef3(kPrev * (aPrev / dPrev));
        break;
      }
    }
  }
  onInputChange();
}

function simpanData() {
  try {
    const data = {
      tagId: document.getElementById('tagId').value,
      tolInput: document.getElementById('tolInput').value,
      tests: getTestBlocks().map(b => ({
        k: b.querySelector('.inp-k').value,
        a: b.querySelector('.inp-a').value,
        d: b.querySelector('.inp-d').value
      }))
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
}

function muatData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      updateAddBtn();
      return;
    }
    const data = JSON.parse(raw);
    if (data.tagId !== undefined) document.getElementById('tagId').value = data.tagId;
    if (data.tolInput !== undefined && data.tolInput !== '') {
      document.getElementById('tolInput').value = data.tolInput;
    }

    let tests = Array.isArray(data.tests) ? data.tests : [];
    if (!tests.length && (data.k1 !== undefined || data.a1 !== undefined || data.d1 !== undefined)) {
      tests = [{ k: data.k1 || '', a: data.a1 || '', d: data.d1 || '' }];
      if (data.k2 || data.a2 || data.d2) tests.push({ k: data.k2 || '', a: data.a2 || '', d: data.d2 || '' });
      if (data.k3 || data.a3 || data.d3) tests.push({ k: data.k3 || '', a: data.a3 || '', d: data.d3 || '' });
    }

    if (tests.length > 0) {
      const first = getTestBlocks()[0];
      first.querySelector('.inp-k').value = tests[0].k || '';
      first.querySelector('.inp-a').value = tests[0].a || '';
      first.querySelector('.inp-d').value = tests[0].d || '';
      for (let i = 1; i < tests.length; i++) {
        tambahTes(tests[i], true);
      }
    }

    updateAddBtn();
    updateLivePreview();
  } catch (e) {
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
  }
}

window.addEventListener('DOMContentLoaded', muatData);

function resetForm() {
  document.getElementById('tagId').value = '';
  document.getElementById('tolInput').value = '0.5';

  const blocks = getTestBlocks();
  for (let i = blocks.length - 1; i >= 1; i--) {
    blocks[i].remove();
  }
  const first = blocks[0];
  first.querySelector('.inp-k').value = '';
  first.querySelector('.inp-a').value = '';
  first.querySelector('.inp-d').value = '';

  updateAddBtn();
  updateLivePreview();
  lastReportData = null;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}

  const el = document.getElementById('result');
  el.classList.remove('show');
  el.innerHTML = '';
  first.querySelector('.inp-k').focus();
}

function getHeroMeta(r, mode) {
  const lastTes = r.hasilTes[r.hasilTes.length - 1];
  if (mode === 'tetap') {
    const label = r.isSingle ? 'Final Coef (Tetap)' : `Final Coef (Test ${lastTes.no})`;
    const nilai = formatCoef3(r.kTetap);
    const pillText = r.errUtama < r.tol
      ? `Error < ${r.tolStr}% · Pertahankan Old Coef`
      : `Coef Terpakai · Error ${fmtId(r.errUtama, 2, 2)}%`;
    return { label, nilai, pillText, isRefStyle: true };
  }
  const label = (!r.isSingle && r.semuaKSama)
    ? 'Combined New Coef'
    : (r.isSingle ? 'New Coef' : `New Coef (Test ${lastTes.no})`);
  const nilai = formatCoef3(r.kBaruVal);
  return {
    label,
    nilai,
    pillText: r.statusUtama.teks,
    isRefStyle: r.statusUtama.kls === 'ok'
  };
}

function setHeroMode(mode) {
  if (!lastReportData) return;
  lastReportData.selectedMode = mode;
  renderResultView(false);
}

function renderResultView(animateBar = true) {
  const r = lastReportData;
  if (!r) return;
  const el = document.getElementById('result');
  const hero = getHeroMeta(r, r.selectedMode);
  const lastTes = r.hasilTes[r.hasilTes.length - 1];

  const escapeHtml = (str) => str.replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));

    ${r.tagId ? `<div class="row"><span>Tag ID</span><span>${escapeHtml(r.tagId)}</span></div>` : ''}

      <div class="row"><span>Actual</span><span>${fmtKg(t.a)} kg</span></div>
      <div class="row"><span>Display</span><span>${fmtKg(t.d)} kg</span></div>
      <div class="row"><span>Diff (Disp − Act)</span><span class="c-${t.status.kls}">${tanda}${fmtKg(t.selisih)} kg (${ket})</span></div>
      <div class="row"><span>Error</span><span class="c-${t.status.kls}">${fmtId(t.errPct, 2, 2)}%</span></div>
      <div class="row"><span>Correction Factor</span><span>${t.faktor.toFixed(4)}</span></div>

      return `
        <div class="test-res-item">

              <div class="v">${formatCoef3(t.k)}</div>
            </div>
            <div class="test-res-cell">
              <div class="k">Actual</div>
              <div class="v">${fmtKg(t.a)} kg</div>
            </div>
            <div class="test-res-cell">
              <div class="k">Display</div>
              <div class="v">${fmtKg(t.d)} kg</div>

    const totalTanda = r.totalSelisih > 0 ? '+' : '';

      ${metaRowsHtml}

  el.className = 'result show';

}

function hitung() {
  const el = document.getElementById('result');
  const tagId = document.getElementById('tagId').value.trim();
  const tol = getTol();

  if (tol === null) {
    el.className = 'result show';
    el.innerHTML = `<div style="text-align:center;font-size:11px;color:#c99494;padding:8px 0;">Input Tolerance (±%) tidak valid (&gt; 0 dan &lt; 50)</div>`;
    lastReportData = null;
    return;
  }

  const blocks = getTestBlocks();
  const hasilTes = [];

  for (let i = 0; i < blocks.length; i++) {
    const no = i + 1;
    const kRaw = blocks[i].querySelector('.inp-k').value.trim();
    const aRaw = blocks[i].querySelector('.inp-a').value.trim();
    const dRaw = blocks[i].querySelector('.inp-d').value.trim();

    if (!kRaw && !aRaw && !dRaw) {
      if (no === 1) {
        el.className = 'result show';
        el.innerHTML = `<div style="text-align:center;font-size:11px;color:#c99494;padding:8px 0;">Input Test 1 belum diisi</div>`;
        lastReportData = null;
        return;
      }
      continue;
    }

    const k = parseFloat(kRaw);
    const a = parseFloat(aRaw);
    const d = parseFloat(dRaw);

    if (isNaN(k) || isNaN(a) || isNaN(d) || k <= 0 || a <= 0 || d <= 0) {
      el.className = 'result show';
      el.innerHTML = `<div style="text-align:center;font-size:11px;color:#c99494;padding:8px 0;">Input Test ${no} tidak valid</div>`;
      lastReportData = null;
      return;
    }

    const faktor  = a / d;
    const kBaru   = k * faktor;
    const selisih = d - a;
    const errPct  = Math.abs(selisih) / a * 100;
    const rawLoad = d / k;

    hasilTes.push({
      no, k, a, d, faktor, kBaru, selisih, errPct, rawLoad,
      status: getStatus(errPct, tol)
    });
  }

  simpanData();
  updateLivePreview();

  const isSingle = hasilTes.length === 1;
  const lastTes  = hasilTes[hasilTes.length - 1];
  const semuaKSama = hasilTes.every(t => Math.abs(t.k - hasilTes[0].k) < 1e-9);

  const totalWB      = hasilTes.reduce((s, t) => s + t.a, 0);
  const totalBW      = hasilTes.reduce((s, t) => s + t.d, 0);
  const totalSelisih = totalBW - totalWB;
  const totalRaw     = hasilTes.reduce((s, t) => s + t.rawLoad, 0);
  const kGabungan    = totalWB / totalRaw;

  const kTetap   = (!isSingle && semuaKSama) ? hasilTes[0].k : lastTes.k;
  const kBaruVal = (!isSingle && semuaKSama) ? kGabungan : lastTes.kBaru;
  const errUtama = (!isSingle && semuaKSama) ? (Math.abs(totalSelisih) / totalWB * 100) : lastTes.errPct;
  const statusUtama = getStatus(errUtama, tol);
  const akurasiAktual = Math.max(0, 100 - errUtama);

  const autoTetap = (errUtama < tol) || (hasilTes.length >= 3 && errUtama <= getWarnMax(tol));

  lastReportData = {
    tagId,
    tol,
    tolStr: fmtPctClean(tol),
    now: new Date(),
    hasilTes,
    isSingle,
    semuaKSama,
    totalWB,
    totalBW,
    totalSelisih,
    kGabungan,
    kTetap,
    kBaruVal,
    errUtama,
    statusUtama,
    akurasiAktual,
    selectedMode: autoTetap ? 'tetap' : 'baru'
  };

  renderResultView(true);
}

function drawRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function downloadJPG() {
  if (!lastReportData) return;
  const r = lastReportData;
  const hero = getHeroMeta(r, r.selectedMode);

  const W = 840;
  const P = 44;
  const CW = W - P * 2;
  const headerH = 176;
  const topGap = 38;
  const cardH = 172;
  const cardGap = 20;
  const summaryH = 132;
  const heroH = 228;

  const cardsTotalH = r.hasilTes.length * cardH + (r.hasilTes.length - 1) * cardGap;
  const afterCardsGap = r.isSingle ? 26 : (cardGap + summaryH + 24);
  const H = headerH + topGap + cardsTotalH + afterCardsGap + heroH + 68;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  const statusColor = (kls) => kls === 'ok' ? '#2c6e3f' : (kls === 'warn' ? '#9c6b16' : '#b33a3a');
  const statusBg    = (kls) => kls === 'ok' ? 'rgba(155,176,148,0.18)' : (kls === 'warn' ? 'rgba(212,187,138,0.2)' : 'rgba(201,148,148,0.2)');
  const statusTextDarkBg = (kls) => kls === 'ok' ? '#b2c7ac' : (kls === 'warn' ? '#d4bb8a' : '#e09a9a');

  ctx.fillStyle = '#f2f4f7';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#1a1c20';
  ctx.fillRect(0, 0, W, headerH);

  const d = r.now;
  const pad2 = (n) => String(n).padStart(2, '0');
  const tglStr = `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#eceef1';
  ctx.font = 'bold 27px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('SPAN COEFFICIENT REPORT', P, 58);

  ctx.fillStyle = '#b8a888';
  ctx.font = '600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(`Belt Scale · Tolerance ±${r.tolStr}%`, P, 92);

  ctx.fillStyle = '#8b93a1';
  ctx.font = '500 15px "SF Mono", Consolas, monospace';
  ctx.fillText(`Date: ${tglStr}`, P, 132);

  const tagBoxW = 240;
  const tagBoxH = 84;
  const tagBoxX = W - P - tagBoxW;
  const tagBoxY = 46;
  drawRoundRect(ctx, tagBoxX, tagBoxY, tagBoxW, tagBoxH, 10);
  ctx.fillStyle = '#242830';
  ctx.fill();
  ctx.strokeStyle = '#3a3f47';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = 'center';
  const tagCenterX = tagBoxX + tagBoxW / 2;
  ctx.fillStyle = '#8b93a1';
  ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('TAG ID', tagCenterX, tagBoxY + 30);

  ctx.fillStyle = r.tagId ? '#eceef1' : '#6b7280';
  ctx.font = 'bold 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText(r.tagId || '-', tagCenterX, tagBoxY + 62, tagBoxW - 24);
  ctx.textAlign = 'left';

  let y = headerH + topGap;

  r.hasilTes.forEach((t, idx) => {
    const isLast = idx === r.hasilTes.length - 1;
    drawRoundRect(ctx, P, y, CW, cardH, 12);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#dcdfe4';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#1a1c20';
    ctx.font = 'bold 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillText(`Test ${t.no}`, P + 24, y + 40);

    const errLabel = `Error ${fmtId(t.errPct, 2, 2)}%`;
    ctx.fillStyle = statusColor(t.status.kls);
    ctx.font = 'bold 18px "SF Mono", Consolas, monospace';
    const errW = ctx.measureText(errLabel).width;
    ctx.fillText(errLabel, P + CW - 24 - errW, y + 40);

    ctx.beginPath();
    ctx.setLineDash([5, 5]);
    ctx.moveTo(P + 24, y + 58);
    ctx.lineTo(P + CW - 24, y + 58);
    ctx.strokeStyle = '#e5e7eb';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.textAlign = 'center';
    const cols = [
      { k: 'OLD COEF', v: formatCoef3(t.k), x: P + CW * (1 / 6) },
      { k: 'ACTUAL', v: `${fmtKg(t.a)} kg`, x: P + CW * (3 / 6) },
      { k: 'DISPLAY', v: `${fmtKg(t.d)} kg`, x: P + CW * (5 / 6) }
    ];
    cols.forEach(c => {
      ctx.fillStyle = '#6b7280';
      ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText(c.k, c.x, y + 86);

      ctx.fillStyle = '#1a1c20';
      ctx.font = '600 19px "SF Mono", Consolas, monospace';
      ctx.fillText(c.v, c.x, y + 114);
    });
    ctx.textAlign = 'left';

    const tanda = t.selisih > 0 ? '+' : '';
    const ket = t.selisih > 0 ? 'Lebih' : (t.selisih < 0 ? 'Kurang' : 'Pas');
    const selText = `Diff: ${tanda}${fmtKg(t.selisih)} kg (${ket})`;
    ctx.fillStyle = statusColor(t.status.kls);
    ctx.font = 'bold 17px "SF Mono", Consolas, monospace';
    ctx.fillText(selText, P + 24, y + 150);

    let newStr = `New Coef: ${formatCoef3(t.kBaru)}`;
    let newCol = '#1a1c20';
    if (isLast && r.selectedMode === 'tetap') {
      newStr = `Final Coef: ${formatCoef3(t.k)}`;
      newCol = statusColor(t.status.kls);
    } else if (t.errPct < r.tol) {
      newStr = `Final Coef: ${formatCoef3(t.k)}`;
      newCol = '#2c6e3f';
    }
    ctx.fillStyle = newCol;
    ctx.font = 'bold 17px "SF Mono", Consolas, monospace';
    const newW = ctx.measureText(newStr).width;
    ctx.fillText(newStr, P + CW - 24 - newW, y + 150);

    y += cardH + cardGap;
  });

  if (!r.isSingle) {
    drawRoundRect(ctx, P, y, CW, summaryH, 12);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#dcdfe4';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const tTanda = r.totalSelisih > 0 ? '+' : '';
    const tKet = r.totalSelisih > 0 ? 'Lebih' : (r.totalSelisih < 0 ? 'Kurang' : 'Pas');
    const grid2x2 = [
      { k: `TOTAL ACTUAL (${r.hasilTes.length} TESTS)`, v: `${fmtKg(r.totalWB)} kg`, x: P + 24, yOff: 34 },
      { k: `TOTAL DISPLAY (${r.hasilTes.length} TESTS)`, v: `${fmtKg(r.totalBW)} kg`, x: P + 395, yOff: 34 },
      { k: 'TOTAL DIFF', v: `${tTanda}${fmtKg(r.totalSelisih)} kg (${tKet})`, x: P + 24, yOff: 88 },
      { k: 'COMBINED COEF', v: formatCoef3(r.kGabungan), x: P + 395, yOff: 88 }
    ];
    grid2x2.forEach(item => {
      ctx.fillStyle = '#6b7280';
      ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText(item.k, item.x, y + item.yOff);

      ctx.fillStyle = '#1a1c20';
      ctx.font = 'bold 18px "SF Mono", Consolas, monospace';
      ctx.fillText(item.v, item.x, y + item.yOff + 24);
    });

    y += summaryH + 24;
  } else {
    y += 6;
  }

  drawRoundRect(ctx, P, y, CW, heroH, 14);
  ctx.fillStyle = '#1a1c20';
  ctx.fill();

  ctx.textAlign = 'center';
  const cx = W / 2;

  ctx.fillStyle = hero.isRefStyle ? '#9bb094' : '#8b93a1';
  ctx.font = '600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText(hero.label.toUpperCase(), cx, y + 48);

  ctx.fillStyle = hero.isRefStyle ? '#b2c7ac' : '#ffffff';
  ctx.font = 'bold 58px "SF Mono", Consolas, monospace';
  ctx.fillText(hero.nilai, cx, y + 118);

  const pillText = `${hero.pillText}  ·  Accuracy ${fmtId(r.akurasiAktual, 2, 2)}%`;
  ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  const pillW = Math.min(CW - 40, ctx.measureText(pillText).width + 40);
  drawRoundRect(ctx, cx - pillW / 2, y + 154, pillW, 38, 19);
  ctx.fillStyle = statusBg(r.statusUtama.kls);
  ctx.fill();

  ctx.fillStyle = statusTextDarkBg(r.statusUtama.kls);
  ctx.fillText(pillText, cx, y + 178, pillW - 22);

  ctx.fillStyle = '#6b7280';
  ctx.font = '500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('Belt Scale · Span Correction', cx, y + heroH + 40);

  const cleanTag = r.tagId ? r.tagId.replace(/[^a-zA-Z0-9_-]/g, '_') : 'BeltScale';
  const stamp = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
  const filename = `Coef_${cleanTag}_${stamp}.jpg`;

  const triggerDownload = (url, revoke) => {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    if (revoke) setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  if (canvas.toBlob) {
    canvas.toBlob((blob) => {
      if (blob) {
        triggerDownload(URL.createObjectURL(blob), true);
      } else {
        triggerDownload(canvas.toDataURL('image/jpeg', 0.95), false);
      }
    }, 'image/jpeg', 0.95);
  } else {
    triggerDownload(canvas.toDataURL('image/jpeg', 0.95), false);
  }
}
</script>

<script>
// ===== POP-UP INSTAL APLIKASI =====
(function () {
  const DISMISS_KEY = 'beltScaleInstallDismissed'; // berlaku selama tab masih terbuka

  // Sudah dibuka sebagai aplikasi terpasang: tidak perlu pop-up
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) return;

  const ua = navigator.userAgent;
  // Browser di dalam aplikasi lain (WhatsApp, Instagram, dll.) tidak bisa instal
  const isAndroidInApp = /Android/i.test(ua) &&
    /FBAN|FBAV|FB_IAB|Instagram|\bLine\/|MicroMessenger|TikTok|musical_ly|BytedanceWebview|Telegram|; wv\)/i.test(ua);

  const overlay = document.getElementById('installModal');
  const desc    = document.getElementById('installDesc');
  const primary = document.getElementById('installPrimary');
  const later   = document.getElementById('installLater');

  let promptEvent = null;
  let dismissed = false;
  try { dismissed = sessionStorage.getItem(DISMISS_KEY) === '1'; } catch (e) {}

  function show() {
    if (!dismissed) overlay.classList.add('show');
  }
  function hide() {
    overlay.classList.remove('show');
  }
  function dismiss() {
    dismissed = true;
    try { sessionStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
    hide();
  }

  primary.addEventListener('click', () => {
    if (isAndroidInApp) {
      const scheme = location.protocol.replace(':', '');
      location.href = `intent://${location.host}${location.pathname}${location.search}` +
        `#Intent;scheme=${scheme};package=com.android.chrome;end`;
      return;
    }
    if (!promptEvent) return;
    const ev = promptEvent;
    promptEvent = null; // satu event hanya bisa dipakai sekali
    dismiss();
    ev.prompt();        // langsung membuka dialog instal bawaan
  });

  later.addEventListener('click', dismiss);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) dismiss(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('show')) dismiss();
  });

  // Browser menyatakan aplikasi siap diinstal: tampilkan pop-up
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    promptEvent = e;
    show();
  });

  window.addEventListener('appinstalled', () => {
    promptEvent = null;
    hide();
  });

  if (isAndroidInApp) {
    desc.textContent = 'Instal dilakukan lewat Chrome. Ketuk tombol di bawah.';
    primary.textContent = 'Buka di Chrome';
    show();
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then((reg) => console.log('Service Worker terdaftar:', reg.scope))
        .catch((err) => console.log('Service Worker gagal:', err));
    });
  }
</script>
